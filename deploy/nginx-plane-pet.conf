limit_req_zone $binary_remote_addr zone=plane_pet_handshake:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=plane_pet_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name plane-pet.8-166-124-212.sslip.io;

    location / {
        return 404;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:32111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /v1/tunnel {
        access_log off;
        limit_req zone=plane_pet_handshake burst=64 nodelay;
        limit_conn plane_pet_connections 64;
        proxy_pass http://127.0.0.1:32111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Plane-Pet-Enroll $http_x_plane_pet_enroll;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}

# Direct-IP TLS avoids the Mainland China unregistered-domain SNI reset while
# retaining normal public certificate validation in the Windows client.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 32112 ssl default_server;
    server_name 8.166.124.212;

    ssl_certificate /etc/letsencrypt/live/8.166.124.212/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.166.124.212/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /admin {
        limit_req zone=plane_pet_handshake burst=64 nodelay;
        proxy_pass http://127.0.0.1:32111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:32111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /v1/tunnel {
        access_log off;
        limit_req zone=plane_pet_handshake burst=64 nodelay;
        limit_conn plane_pet_connections 64;
        proxy_pass http://127.0.0.1:32111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Plane-Pet-Enroll $http_x_plane_pet_enroll;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
