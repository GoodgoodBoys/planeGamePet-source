limit_req_zone $binary_remote_addr zone=plane_pet_handshake:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=plane_pet_connections:10m;

server {
    server_name plane-pet.8-166-124-212.sslip.io;

    location / {
        return 404;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:32111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /v1/tunnel {
        access_log off;
        limit_req zone=plane_pet_handshake burst=6 nodelay;
        limit_conn plane_pet_connections 4;
        proxy_pass http://127.0.0.1:32111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Plane-Pet-Enroll $http_x_plane_pet_enroll;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/plane-pet.8-166-124-212.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/plane-pet.8-166-124-212.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location = /admin {
        limit_req zone=plane_pet_handshake burst=6 nodelay;
        proxy_pass http://127.0.0.1:32111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}

